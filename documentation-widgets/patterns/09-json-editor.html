<!--
  Patrón 09 — Editor visual de estructura
  Cuándo usar: configs, validaciones, queries — cualquier cosa que se construye.
  Interacción: modificar campos del formulario y ver la salida en código en tiempo real.
-->
<section class="section pattern-09" id="editor-PLACEHOLDER">
  <header class="section__header">
    <span class="badge">Construye en vivo</span>
    <h2>Reglas de <span class="accent">validación</span></h2>
    <p class="lede">Configura el campo en el formulario y observa cómo se construye la regla equivalente.</p>
  </header>

  <p style="font-size: var(--fs-small, 13px); color: var(--ink-500, #78716c);">
    <span class="interactive-badge" aria-label="Interactivo">↺</span>
    Cambia cualquier valor y la salida se actualiza al instante.
  </p>

  <div class="ed-grid">
    <div class="ed-form" id="ed-form"></div>
    <pre class="ed-output" id="ed-out"></pre>
  </div>
</section>

<style>
  .pattern-09 .ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width: 700px){ .pattern-09 .ed-grid{ grid-template-columns:1fr; } }
  .pattern-09 .ed-form{display:flex;flex-direction:column;gap:10px;}
  .pattern-09 .ed-row{display:flex;flex-direction:column;gap:4px;}
  .pattern-09 .ed-row label{font-size:12px;color:var(--ink-500,#78716c);font-weight:500;}
  .pattern-09 .ed-row input[type="text"],.pattern-09 .ed-row input[type="number"],.pattern-09 .ed-row select{padding:6px 10px;font-size:13px;border:1px solid var(--ink-300,#d3d1c7);border-radius:6px;background:#fff;color:var(--ink-700,#292524);font-family:inherit;}
  .pattern-09 .ed-checks{display:flex;flex-wrap:wrap;gap:6px;}
  .pattern-09 .ed-check{display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--ink-50,#f8f7f4);border:1px solid var(--ink-200,#e4e2d8);border-radius:6px;font-size:12px;cursor:pointer;user-select:none;color:var(--ink-700,#292524);}
  .pattern-09 .ed-check input{margin:0;}
  .pattern-09 .ed-output{background:#1e1e26;color:#e4e4e7;padding:14px 16px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;overflow-x:auto;margin:0;min-height:200px;white-space:pre;}
  .pattern-09 .ed-output .k{color:#7dd3fc;}
  .pattern-09 .ed-output .s{color:#bef264;}
  .pattern-09 .ed-output .n{color:#fdba74;}
  .pattern-09 .ed-output .b{color:#c4b5fd;}
  .pattern-09 .ed-output .p{color:#71717a;}
</style>

<script>
(function(){
  // === DATOS ===
  // "campos" describe el formulario. "plantilla" es la función que toma el estado
  // y devuelve el HTML resaltado (con clases .k .s .n .b .p sobre el fondo oscuro).
  const config = {
    campos: [
      { id:'name',      tipo:'text',     label:'Nombre del campo', defecto:'email' },
      { id:'type',      tipo:'select',   label:'Tipo',             defecto:'email',
        opciones:['string','integer','email','boolean','array'] },
      { id:'required',  tipo:'checkbox', label:'required',  defecto:true },
      { id:'nullable',  tipo:'checkbox', label:'nullable',  defecto:false },
      { id:'unique',    tipo:'checkbox', label:'unique',    defecto:false },
      { id:'confirmed', tipo:'checkbox', label:'confirmed', defecto:false },
      { id:'min',       tipo:'number',   label:'Mínimo',    defecto:3 },
      { id:'max',       tipo:'number',   label:'Máximo',    defecto:255 },
      { id:'msg',       tipo:'text',     label:'Mensaje personalizado (opcional)', defecto:'' }
    ],
    plantilla: (s) => {
      const esc = x => String(x).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
      const rules = [];
      if (s.required) rules.push('required');
      if (s.nullable) rules.push('nullable');
      rules.push(s.type);
      if (s.min > 0) rules.push('min:' + s.min);
      if (s.max > 0) rules.push('max:' + s.max);
      if (s.unique) rules.push('unique:users,' + s.name);
      if (s.confirmed) rules.push('confirmed');
      const rulesStr = rules.join('|');
      const name = esc(s.name || 'campo');
      let html = '<span class="p">// Form Request generado</span>\n';
      html += '<span class="b">public function</span> <span class="k">rules</span>(): <span class="b">array</span>\n{\n';
      html += '    <span class="b">return</span> [\n';
      html += `        <span class="s">'${name}'</span> =&gt; <span class="s">'${esc(rulesStr)}'</span>,\n`;
      html += '    ];\n}\n';
      if (s.msg) {
        html += '\n<span class="b">public function</span> <span class="k">messages</span>(): <span class="b">array</span>\n{\n';
        html += '    <span class="b">return</span> [\n';
        html += `        <span class="s">'${name}.required'</span> =&gt; <span class="s">'${esc(s.msg)}'</span>,\n`;
        html += '    ];\n}\n';
      }
      return html;
    }
  };
  // === LÓGICA ===
  const form = document.getElementById('ed-form');
  const out = document.getElementById('ed-out');
  const state = {};
  // Render form
  config.campos.forEach(c => {
    state[c.id] = c.defecto;
    const row = document.createElement('div');
    row.className = 'ed-row';
    if (c.tipo === 'checkbox') {
      row.innerHTML = `<label class="ed-check"><input type="checkbox" data-id="${c.id}" ${c.defecto ? 'checked' : ''}><span>${c.label}</span></label>`;
    } else if (c.tipo === 'select') {
      row.innerHTML = `<label>${c.label}</label><select data-id="${c.id}">${c.opciones.map(o => `<option value="${o}"${o === c.defecto ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
    } else if (c.tipo === 'number') {
      row.innerHTML = `<label>${c.label}</label><input type="number" data-id="${c.id}" value="${c.defecto}">`;
    } else {
      row.innerHTML = `<label>${c.label}</label><input type="text" data-id="${c.id}" value="${c.defecto}">`;
    }
    form.appendChild(row);
  });
  function refresh(){
    document.querySelectorAll('.pattern-09 [data-id]').forEach(el => {
      const id = el.dataset.id;
      const c = config.campos.find(x => x.id === id);
      if (c.tipo === 'checkbox') state[id] = el.checked;
      else if (c.tipo === 'number') state[id] = parseInt(el.value) || 0;
      else state[id] = el.value;
    });
    out.innerHTML = config.plantilla(state);
  }
  document.querySelectorAll('.pattern-09 [data-id]').forEach(el => {
    el.addEventListener('input', refresh);
    el.addEventListener('change', refresh);
  });
  refresh();
})();
</script>
