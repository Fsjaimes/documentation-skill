<!--
  Patrón 07 — Antes/después con slider divisor
  Cuándo usar: refactors, migraciones, comparación visual entre dos estados.
  Interacción: arrastrar divisor vertical para revelar gradualmente el "después".
-->
<section class="section pattern-07" id="ba-PLACEHOLDER">
  <header class="section__header">
    <span class="badge">Antes vs después</span>
    <h2>Evolución de la <span class="accent">arquitectura</span></h2>
    <p class="lede">Compara el estado anterior con el actual. Arrastra el divisor para revelar el cambio.</p>
  </header>

  <p style="font-size: var(--fs-small, 13px); color: var(--ink-500, #78716c);">
    <span class="interactive-badge" aria-label="Interactivo">↺</span>
    Arrastra el divisor central de izquierda a derecha.
  </p>

  <div class="ba-wrap" id="ba-wrap">
    <div class="ba-side" id="ba-before"></div>
    <div class="ba-side ba-after" id="ba-after"></div>
    <span class="ba-label before" id="ba-lbl-before">ANTES</span>
    <span class="ba-label after" id="ba-lbl-after">DESPUÉS</span>
    <div class="ba-divider" id="ba-div"></div>
    <div class="ba-handle" id="ba-handle" aria-label="Arrastra para comparar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/><polyline points="9 18 3 12 9 6"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:-4px;"><polyline points="9 18 15 12 9 6"/><polyline points="15 18 21 12 15 6"/></svg>
    </div>
  </div>
</section>

<style>
  .pattern-07 .ba-wrap{position:relative;width:100%;aspect-ratio:640/340;background:var(--ink-50,#f8f7f4);border:1px solid var(--ink-200,#e4e2d8);border-radius:12px;overflow:hidden;user-select:none;touch-action:none;}
  .pattern-07 .ba-side{position:absolute;inset:0;}
  .pattern-07 .ba-side svg{width:100%;height:100%;}
  .pattern-07 .ba-after{clip-path:inset(0 0 0 50%);}
  .pattern-07 .ba-label{position:absolute;top:12px;padding:4px 10px;font-size:11px;font-weight:500;border-radius:6px;font-family:ui-monospace,Menlo,monospace;}
  .pattern-07 .ba-label.before{left:12px;background:var(--danger-soft,#FCEBEB);color:var(--danger-dark,#501313);}
  .pattern-07 .ba-label.after{right:12px;background:var(--success-soft,#E1F5EE);color:var(--success-dark,#04342C);}
  .pattern-07 .ba-divider{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.15);}
  .pattern-07 .ba-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;background:#fff;border-radius:50%;border:1px solid var(--ink-300,#d3d1c7);display:flex;align-items:center;justify-content:center;cursor:ew-resize;color:var(--ink-500,#78716c);box-shadow:0 2px 6px rgba(0,0,0,.08);}
</style>

<script>
(function(){
  // === DATOS ===
  // Los SVG son inyectados como strings. Deben tener el mismo viewBox para alinearse.
  // Sugerencia: viewBox="0 0 640 340" para encajar con el contenedor 640x340.
  const datos = {
    etiquetaAntes: 'ANTES',
    etiquetaDespues: 'DESPUÉS',
    antesSvg: `<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
      <rect x="120" y="60" width="400" height="220" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
      <text x="320" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#501313">Monolito Laravel</text>
      <rect x="150" y="110" width="150" height="40" rx="6" fill="#fff" stroke="#A32D2D"/>
      <text x="225" y="135" text-anchor="middle" font-size="11" fill="#791F1F">Auth + Sessions</text>
      <rect x="340" y="110" width="150" height="40" rx="6" fill="#fff" stroke="#A32D2D"/>
      <text x="415" y="135" text-anchor="middle" font-size="11" fill="#791F1F">Estudios</text>
      <rect x="150" y="170" width="150" height="40" rx="6" fill="#fff" stroke="#A32D2D"/>
      <text x="225" y="195" text-anchor="middle" font-size="11" fill="#791F1F">Facturación</text>
      <rect x="340" y="170" width="150" height="40" rx="6" fill="#fff" stroke="#A32D2D"/>
      <text x="415" y="195" text-anchor="middle" font-size="11" fill="#791F1F">Reportes</text>
      <rect x="245" y="230" width="150" height="34" rx="6" fill="#fff" stroke="#A32D2D"/>
      <text x="320" y="252" text-anchor="middle" font-size="11" fill="#791F1F">PostgreSQL única</text>
    </svg>`,
    despuesSvg: `<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
      <rect x="40" y="80" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
      <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Auth Service</text>
      <text x="110" y="123" text-anchor="middle" font-size="10" fill="#0F6E56">JWT · Redis</text>
      <rect x="200" y="80" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
      <text x="270" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Estudios API</text>
      <rect x="360" y="80" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
      <text x="430" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Facturación</text>
      <rect x="520" y="80" width="80" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
      <text x="560" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Reportes</text>
      <rect x="200" y="180" width="240" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
      <text x="320" y="205" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">Message Bus (RabbitMQ)</text>
      <rect x="80" y="250" width="120" height="34" rx="6" fill="#fff" stroke="#0F6E56"/>
      <text x="140" y="272" text-anchor="middle" font-size="10" fill="#085041">db_auth</text>
      <rect x="260" y="250" width="120" height="34" rx="6" fill="#fff" stroke="#0F6E56"/>
      <text x="320" y="272" text-anchor="middle" font-size="10" fill="#085041">db_estudios</text>
      <rect x="440" y="250" width="120" height="34" rx="6" fill="#fff" stroke="#0F6E56"/>
      <text x="500" y="272" text-anchor="middle" font-size="10" fill="#085041">db_facturas</text>
    </svg>`
  };
  // === LÓGICA ===
  document.getElementById('ba-before').innerHTML = datos.antesSvg;
  document.getElementById('ba-after').innerHTML = datos.despuesSvg;
  document.getElementById('ba-lbl-before').textContent = datos.etiquetaAntes;
  document.getElementById('ba-lbl-after').textContent = datos.etiquetaDespues;
  const wrap = document.getElementById('ba-wrap');
  const after = document.getElementById('ba-after');
  const div = document.getElementById('ba-div');
  const handle = document.getElementById('ba-handle');
  let dragging = false;
  function setPos(px){
    const r = wrap.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((px - r.left) / r.width) * 100));
    after.style.clipPath = `inset(0 0 0 ${pct}%)`;
    div.style.left = pct + '%';
    handle.style.left = pct + '%';
  }
  handle.addEventListener('pointerdown', e => { dragging = true; handle.setPointerCapture(e.pointerId); });
  wrap.addEventListener('pointermove', e => { if (dragging) setPos(e.clientX); });
  wrap.addEventListener('pointerup', () => dragging = false);
  wrap.addEventListener('click', e => {
    if (e.target === wrap || e.target.closest('.ba-side')) setPos(e.clientX);
  });
})();
</script>
