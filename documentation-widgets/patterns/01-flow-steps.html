<!--
  Patrón 01 — Flujo por etapas
  Cuándo usar: procesos lineales con 3-6 pasos cronológicos.
  Interacción: el usuario avanza/retrocede por etapas con botones.
-->
<section class="section pattern-01" id="flow-PLACEHOLDER">
  <header class="section__header">
    <span class="badge">Flujo del proceso</span>
    <h2>¿Cómo funciona <span class="accent">internamente</span>?</h2>
    <p class="lede">Cada vez que se ejecuta el proceso, suceden varias etapas en secuencia. Recórrelas en orden.</p>
  </header>

  <p style="font-size: var(--fs-small, 13px); color: var(--ink-500, #78716c);">
    <span class="interactive-badge" aria-label="Interactivo">↺</span>
    Usa los botones para avanzar por las etapas.
  </p>

  <div class="fl-flow">
    <div class="fl-flow__eyebrow">Flujo interno</div>
    <div class="fl-nodes" id="fl-nodes"></div>
    <div class="fl-nav">
      <button class="btn btn--secondary" id="fl-prev" type="button" disabled>← Anterior</button>
      <div class="fl-hint">Etapa <strong id="fl-cur">1</strong> de <strong id="fl-total">3</strong></div>
      <button class="btn btn--primary" id="fl-next" type="button">Siguiente →</button>
    </div>
  </div>
</section>

<style>
  .pattern-01 .fl-flow{padding:18px;background:var(--ink-50,#f8f7f4);border-radius:12px;border:1px solid var(--ink-200,#e4e2d8);}
  .pattern-01 .fl-flow__eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-500,#78716c);margin-bottom:14px;}
  .pattern-01 .fl-nodes{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;}
  .pattern-01 .fl-node{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;}
  .pattern-01 .fl-node__circle{width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--ink-200,#e4e2d8);display:flex;align-items:center;justify-content:center;color:var(--ink-500,#78716c);transition:all .25s;}
  .pattern-01 .fl-node__circle.is-lit{background:var(--accent-soft,#EEEDFE);border-color:var(--accent,#534AB7);color:var(--accent-dark,#3C3489);}
  .pattern-01 .fl-node__label{font-size:12px;color:var(--ink-500,#78716c);text-align:center;line-height:1.3;max-width:90px;transition:color .25s;}
  .pattern-01 .fl-node__label.is-lit{color:var(--ink-700,#292524);font-weight:500;}
  .pattern-01 .fl-arrow{flex:1;display:flex;align-items:center;height:2px;background:var(--ink-200,#e4e2d8);position:relative;margin-top:-26px;}
  .pattern-01 .fl-arrow__fill{height:100%;background:var(--accent,#534AB7);width:0;transition:width .35s;}
  .pattern-01 .fl-nav{display:flex;justify-content:space-between;align-items:center;}
  .pattern-01 .fl-hint{font-size:13px;color:var(--ink-500,#78716c);}
  .pattern-01 .fl-detail{margin-top:14px;padding:14px 16px;background:#fff;border-radius:8px;border:1px solid var(--ink-200,#e4e2d8);font-size:13px;line-height:1.6;color:var(--ink-500,#78716c);}
  .pattern-01 .fl-detail strong{color:var(--ink-700,#292524);}
</style>

<script>
(function(){
  // === DATOS === (la skill reemplaza este bloque)
  const etapas = [
    { titulo: 'Comando Artisan', descripcion: 'El usuario invoca el comando desde la consola. Laravel resuelve la clase del comando y lo instancia.', icono: '<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>' },
    { titulo: 'Leer JSON', descripcion: 'Se abre el archivo, se valida el esquema y se parsea el contenido a colecciones en memoria.', icono: '<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>' },
    { titulo: 'Inserción en BD', descripcion: 'Los registros se insertan en lotes dentro de una transacción. Si algo falla, se hace rollback.', icono: '<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.657 4.03 3 9 3s9-1.343 9-3V5"/><path d="M3 12c0 1.657 4.03 3 9 3s9-1.343 9-3"/></svg>' }
  ];
  // === LÓGICA ===
  const nodes = document.getElementById('fl-nodes');
  const total = document.getElementById('fl-total');
  const cur = document.getElementById('fl-cur');
  const prev = document.getElementById('fl-prev');
  const next = document.getElementById('fl-next');
  let i = 0;
  total.textContent = etapas.length;
  function build(){
    let html = '';
    etapas.forEach((e, idx) => {
      html += `<div class="fl-node"><div class="fl-node__circle" data-i="${idx}">${e.icono}</div><div class="fl-node__label" data-i="${idx}">${e.titulo}</div></div>`;
      if (idx < etapas.length - 1) html += `<div class="fl-arrow"><div class="fl-arrow__fill" data-arrow="${idx}"></div></div>`;
    });
    nodes.innerHTML = html;
    const det = document.createElement('div');
    det.className = 'fl-detail'; det.id = 'fl-detail';
    nodes.parentNode.insertBefore(det, nodes.nextSibling);
  }
  function update(){
    document.querySelectorAll('.pattern-01 .fl-node__circle').forEach((c, idx) => c.classList.toggle('is-lit', idx <= i));
    document.querySelectorAll('.pattern-01 .fl-node__label').forEach((l, idx) => l.classList.toggle('is-lit', idx <= i));
    document.querySelectorAll('.pattern-01 .fl-arrow__fill').forEach((a, idx) => a.style.width = idx < i ? '100%' : '0');
    cur.textContent = i + 1;
    prev.disabled = i === 0;
    next.disabled = i === etapas.length - 1;
    const det = document.getElementById('fl-detail');
    det.innerHTML = `<strong>${etapas[i].titulo}.</strong> ${etapas[i].descripcion}`;
  }
  prev.onclick = () => { if (i > 0) { i--; update(); } };
  next.onclick = () => { if (i < etapas.length - 1) { i++; update(); } };
  build(); update();
})();
</script>
